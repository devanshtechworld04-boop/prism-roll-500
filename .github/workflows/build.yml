name: Build Signed APK and PlayStore AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & AdMob
        run: |
          npm install
          npx cap init "Prism Roll 500" "com.prismroll.game500" --web-dir=www
          npx cap add android

      - name: Configure AdMob App ID in AndroidManifest
        run: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          meta = "<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-5317235020851620~7733811820\"/>"
          content = content.replace("</application>", meta + "\n</application>")
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore android/app/prismroll.jks -keyalg RSA -keysize 2048 -validity 10000 -alias prismrollkey -storepass prism1234 -keypass prism1234 -dname "CN=PrismRoll, OU=Games, O=PrismStudio, L=Hyderabad, S=Telangana, C=IN"

      - name: Configure Release Signing in Gradle
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          signing = """
              signingConfigs {
                  release {
                      storeFile file("prismroll.jks")
                      storePassword "prism1234"
                      keyAlias "prismrollkey"
                      keyPassword "prism1234"
                  }
              }
          """
          content = content.replace("buildTypes {", signing + "\n    buildTypes {")
          content = content.replace("minifyEnabled false", "minifyEnabled false\n            signingConfig signingConfigs.release")
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Sync & Build Signed APK + Play Store AAB
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload Signed APK (For Mobile Install)
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Roll-500-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play Store AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Roll-500-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
