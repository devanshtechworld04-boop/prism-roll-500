name: Build Signed APK and PlayStore AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & AdMob
        run: |
          npm install
          npx cap init "Prism Roll 500" "com.prismroll.game500" --web-dir=www
          npx cap add android

      - name: Configure AdMob App ID in AndroidManifest
        run: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          meta = "<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-5317235020851620~0000000000\"/>"
          content = content.replace("</application>", meta + "\n</application>")
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore android/app/prismroll.jks -keyalg RSA -keysize 2048 -validity 10000 -alias prismrollkey -storepass prism1234 -keypass prism1234 -dname "CN=PrismRoll, OU=Games, O=PrismStudio, L=Hyderabad, S=Telangana, C=IN"

      - name: Sync & Build Unsigned Release
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Sign APK and AAB Directly with apksigner & jarsigner
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks android/app/prismroll.jks --ks-pass pass:prism1234 --key-pass pass:prism1234 --ks-key-alias prismrollkey --out android/app/build/outputs/apk/release/PrismRoll500-Final.apk android/app/build/outputs/apk/release/app-aligned.apk
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/app/prismroll.jks -storepass prism1234 -keypass prism1234 android/app/build/outputs/bundle/release/app-release.aab prismrollkey

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismRoll500-Final-APK
          path: android/app/build/outputs/apk/release/PrismRoll500-Final.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: PrismRoll500-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
