name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & AdMob
        run: |
          npm install
          npx cap init "Prism Roll 500" "com.prismroll.game500" --web-dir=www
          npx cap add android

      - name: Configure AdMob App ID in AndroidManifest
        run: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          meta = "<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-5317235020851620~7733811820\"/>"
          content = content.replace("</application>", meta + "\n</application>")
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Sync & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Roll-500-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
