<script>
/**
 * ============================================================================
 * GOOGLE ADMOB FULL INTEGRATION BRIDGE (ALL 6 AD UNITS CONFIGURED)
 * ============================================================================
 */
const AdMobConfig = {
    bannerId: "ca-app-pub-5317235020851620/2289913450",
    interstitialId: "ca-app-pub-5317235020851620/6967525065",
    rewardedInterstitialId: "ca-app-pub-5317235020851620/9402116716",
    rewardedId: "ca-app-pub-5317235020851620/6584381682",
    nativeAdvancedId: "ca-app-pub-5317235020851620/3716731101",
    appOpenId: "ca-app-pub-5317235020851620/1880905256",
    levelsPerInterstitial: 3 // Every 3 completed levels triggers Interstitial Ad
};

let levelsPlayedCount = 0;
let bonusClaimedThisLevel = false;

// 1. Initialize AdMob, App Open Ad, Banner Ad & Native Ad on Startup
async function initAllAdMobUnits() {
    console.log("Initializing AdMob with User Ad Unit IDs...");
    
    // Capacitor AdMob Community Plugin Support
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
        const { AdMob } = window.Capacitor.Plugins;
        try {
            await AdMob.initialize({
                requestTrackingAuthorization: true,
                initializeForTesting: false // Live Ads Enabled
            });

            // Show Persistent Bottom Banner Ad
            await AdMob.showBanner({
                adId: AdMobConfig.bannerId,
                adSize: 'ADAPTIVE_BANNER',
                position: 'BOTTOM_CENTER',
                margin: 0
            });

            // Preload Interstitial & Rewarded Ads
            AdMob.prepareInterstitial({ adId: AdMobConfig.interstitialId });
            AdMob.prepareRewardVideoAd({ adId: AdMobConfig.rewardedId });
        } catch (err) {
            console.error("AdMob Capacitor Init Error:", err);
        }
    }

    // Native Android WebView Bridge Support (If wrapped via Android Studio / Sketchware / APK Builder)
    if (window.AndroidAds) {
        if (window.AndroidAds.loadAppOpen) window.AndroidAds.loadAppOpen(AdMobConfig.appOpenId);
        if (window.AndroidAds.loadBanner) window.AndroidAds.loadBanner(AdMobConfig.bannerId);
        if (window.AndroidAds.loadNative) window.AndroidAds.loadNative(AdMobConfig.nativeAdvancedId);
        if (window.AndroidAds.preloadInterstitial) window.AndroidAds.preloadInterstitial(AdMobConfig.interstitialId);
        if (window.AndroidAds.preloadRewarded) window.AndroidAds.preloadRewarded(AdMobConfig.rewardedId);
        if (window.AndroidAds.preloadRewardedInterstitial) window.AndroidAds.preloadRewardedInterstitial(AdMobConfig.rewardedInterstitialId);
    }
}

// Trigger App Open Ad when user returns to app from background
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && gameState === "MENU") {
        if (window.AndroidAds && window.AndroidAds.showAppOpen) {
            window.AndroidAds.showAppOpen(AdMobConfig.appOpenId);
        }
    }
});

// 2. Interstitial Ad Trigger (Every 3 Levels)
async function showInterstitialAd() {
    console.log("Showing Interstitial Ad:", AdMobConfig.interstitialId);
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
        const { AdMob } = window.Capacitor.Plugins;
        try {
            await AdMob.showInterstitial();
            AdMob.prepareInterstitial({ adId: AdMobConfig.interstitialId }); // Preload next
        } catch (e) { console.log(e); }
    } else if (window.AndroidAds && window.AndroidAds.showInterstitial) {
        window.AndroidAds.showInterstitial(AdMobConfig.interstitialId);
    }
}

// 3. Rewarded Ad Trigger (Revive Player on Crash)
async function triggerRewardedRevive() {
    console.log("Showing Rewarded Ad for Revive:", AdMobConfig.rewardedId);
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
        const { AdMob } = window.Capacitor.Plugins;
        try {
            const reward = await AdMob.showRewardVideoAd();
            if (reward) revivePlayer();
            AdMob.prepareRewardVideoAd({ adId: AdMobConfig.rewardedId });
        } catch (e) {
            revivePlayer();
        }
    } else if (window.AndroidAds && window.AndroidAds.showRewarded) {
        window.AndroidAds.showRewarded(AdMobConfig.rewardedId);
        // Native callback should call window.onAdRewardEarned('revive')
    } else {
        // Fallback when testing in browser
        revivePlayer();
    }
}

// 4. Rewarded Interstitial Ad Trigger (2X Gems Bonus on Level Complete)
async function triggerRewardedInterstitialBonus() {
    if (bonusClaimedThisLevel) return;
    console.log("Showing Rewarded Interstitial Ad for 2X Gems:", AdMobConfig.rewardedInterstitialId);
    
    if (window.AndroidAds && window.AndroidAds.showRewardedInterstitial) {
        window.AndroidAds.showRewardedInterstitial(AdMobConfig.rewardedInterstitialId);
    } else if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
        const { AdMob } = window.Capacitor.Plugins;
        try {
            await AdMob.prepareRewardVideoAd({ adId: AdMobConfig.rewardedInterstitialId });
            await AdMob.showRewardVideoAd();
            grantDoubleGemsBonus();
        } catch (e) {
            grantDoubleGemsBonus();
        }
    } else {
        // Fallback when testing in browser
        grantDoubleGemsBonus();
    }
}

function grantDoubleGemsBonus() {
    if (bonusClaimedThisLevel) return;
    bonusClaimedThisLevel = true;
    totalGems += 25; // Extra +25 to make +50 total
    saveProgress();
    playSound('win');
    document.getElementById('winRewardText').innerText = "2X BONUS CLAIMED! (+50 GEMS)";
    document.getElementById('btnDoubleGems').classList.add('hidden');
}

// Global Callback Function for Native Android Java/Kotlin Bridge
window.onAdRewardEarned = function(rewardType) {
    if (rewardType === 'revive') revivePlayer();
    if (rewardType === 'double_gems') grantDoubleGemsBonus();
};

window.addEventListener('load', initAllAdMobUnits);

/**
 * ============================================================================
 * WEB AUDIO API SYNTHESIZER (NO EXTERNAL MP3 FILES NEEDED!)
 * ============================================================================
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'gem') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'switch') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
    } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(500, now + 0.1);
        osc.frequency.setValueAtTime(600, now + 0.2);
        osc.frequency.setValueAtTime(800, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
    }
}

/**
 * ============================================================================
 * CORE 500-LEVEL PROCEDURAL GAME ENGINE

 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height;

let maxUnlockedLevel = parseInt(localStorage.getItem('prismRoll_maxLvl')) || 1;

    document.getElementById('menuLevelDisplay').innerText = currentLevel;

updateMenuUI();

let ball = {

};

let levelData = {

};

let particles = [];
let isDragging = false;
let lastTouchX = 0;

function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
}

    const rand = () => { seed++; return seededRandom(seed); };

    const levelLength = 3500 + (lvl * 35);
    const numColors = lvl < 15 ? 2 : (lvl < 60 ? 3 : 4);
    const bgHue = (lvl * 27) % 360;

    let entities = [];
    let currentColor = Math.floor(rand() * numColors);
    ball.colorIndex = currentColor;
    ball.x = 0;
    ball.trail = [];

    let z = 600;
    let step = Math.max(240, 380 - (lvl * 0.25));

    while (z < levelLength - 500) {
        let patter
